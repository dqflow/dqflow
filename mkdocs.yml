site_name: dqflow
site_description: Data contracts for Python data pipelines. Define, validate, fail fast.
site_url: https://dqflow.github.io/dqflow
repo_url: https://github.com/dqflow/dqflow
repo_name: dqflow/dqflow

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Defining Contracts: guide/contracts.md
      - Column Validations: guide/columns.md
      - Table Rules: guide/rules.md
      - YAML Contracts: guide/yaml.md
      - CLI Usage: guide/cli.md
  - API Reference:
      - Contract: api/contract.md
      - Column: api/column.md
      - ValidationResult: api/result.md
  - Changelog: changelog.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dqflow/dqflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dqflow/
