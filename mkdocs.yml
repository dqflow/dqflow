site_name: dqflow
site_description: Data contracts for Python data pipelines. Define, validate, fail fast.
site_url: https://dqflow.readthedocs.io/en/latest/
repo_url: https://github.com/dqflow/dqflow
repo_name: dqflow/dqflow

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Start Here:
      - 5-minute quickstart: getting-started/quickstart.md
      - Installation: getting-started/installation.md
  - User Guide:
      - Contract Diff: guide/diff.md
      - Defining Contracts: guide/contracts.md
      - Column Validations: guide/columns.md
      - Table Rules: guide/rules.md
      - Cross-column & Custom Checks: guide/custom-checks.md
      - YAML Contracts: guide/yaml.md
      - Linting Contracts: guide/lint.md
      - Schema Versioning: guide/schema-versioning.md
      - Editor Integration: guide/editor-integration.md
      - CLI Usage: guide/cli.md
      - Inferring Contracts: guide/inference.md
      - Choosing an Engine: guide/engines.md
  - Workflows:
      - Validate in an ETL Pipeline: workflows/etl-pipeline.md
      - CI/CD tutorial: workflows/ci-pull-request.md
      - Infer and Refine a Contract: workflows/infer-refine.md
  - API Reference:
      - Contract: api/contract.md
      - Column & CrossColumnRule: api/column.md
      - ValidationSpec: api/spec.md
      - Contract schema: api/schema.md
      - Table-rule evaluator: api/rules.md
      - Statistics cache: api/cache.md
      - Results: api/result.md
      - Contract Diff: api/diff.md
      - Engines: api/engines.md
      - Execution context: api/context.md
      - Inference: api/inference.md
  - Reference:
      - Stability & Compatibility: reference/stability.md
      - 1.0 Readiness: reference/v1-readiness.md
  - Changelog: changelog.md
  - Contributing: contributing.md

hooks:
  - mkdocs_hooks.py

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false
            signature_crossrefs: true

copyright: Copyright &copy; 2026 dqflow contributors
