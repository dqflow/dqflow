name: customers
columns:
  customer_id:
    dtype: string
    not_null: true
    unique: true
    pattern: "^C[0-9]{3}$"
  tier:
    dtype: string
    not_null: true
    allowed: [premium, standard]
  credit_limit:
    dtype: integer
    not_null: true
    min: 0
    max: 10000
rules:
  - row_count > 0
