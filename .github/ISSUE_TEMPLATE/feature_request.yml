name: Feature request
description: Propose a concrete new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For an open-ended design discussion, open an
        [RFC discussion](https://github.com/dqflow/dqflow/discussions) instead.
        This form is for a specific, actionable ask.
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I checked the [ROADMAP](https://github.com/dqflow/dqflow/blob/main/ROADMAP.md) and [existing issues](https://github.com/dqflow/dqflow/issues?q=is%3Aissue)
          required: true
        - label: This fits dqflow's scope — a lightweight, contract-first validation library, not an observability platform
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that dqflow makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: A sketch of the contract field, CLI flag, or function you have in mind.
      render: python
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, with review guidance"
        - "Maybe, with help"
        - "No"
    validations:
      required: true
