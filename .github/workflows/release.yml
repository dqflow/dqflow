name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/packaging/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  wheel-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            extra: ""
          - profile: pandas
            extra: "[pandas]"
          - profile: polars
            extra: "[polars]"
          - profile: pandas-parquet
            extra: "[pandas-parquet]"
          - profile: all
            extra: "[all]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps --no-index --find-links dist dqflow
      - run: python -m pip install --find-links dist "dqflow${{ matrix.extra }}"
      - run: python -m pip check
      - run: python tests/packaging/smoke.py
        env:
          DQFLOW_SMOKE_PROFILE: ${{ matrix.profile }}

  publish:
    needs: wheel-smoke
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
