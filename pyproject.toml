[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dqflow"
dynamic = ["version"]
description = "Data contracts for Python data pipelines. Define, validate, fail fast."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"

authors = [
    { name = "Quang", email = "nguyenvanquang247@gmail.com" },
]

keywords = [
    "data-quality",
    "data-validation",
    "data-contracts",
    "data-contract",
    "data-engineering",
    "schema-validation",
    "dataframe",
    "etl",
    "ci-cd",
    "pandas",
    "polars",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]

dependencies = [
    "pyyaml>=6.0.2,<7",
    "click>=8.1.7,<9",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.3.3,<4",
]

polars = [
    "polars>=1.0,<2",
]

pandas-parquet = [
    "pandas>=2.3.3,<4",
    "pyarrow>=22,<26",
]

# Compatibility alias retained for one minor release. Prefer pandas-parquet.
parquet = [
    "pandas>=2.3.3,<4",
    "pyarrow>=22,<26",
]

all = [
    "pandas>=2.3.3,<4",
    "polars>=1.0,<2",
    "pyarrow>=22,<26",
]

dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.14.14",
    "mypy>=1.0",
    "pandas>=2.3.3,<4",
    "pandas-stubs>=2.3",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
    "polars>=1.0,<2",
    "pyarrow>=22,<26",
    "jsonschema>=4.18",
]

docs = [
    "mkdocs>=1.5",
    "pymdown-extensions>=10.0",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
dq = "dqflow.cli:main"

[project.urls]
Homepage = "https://github.com/dqflow/dqflow"
Repository = "https://github.com/dqflow/dqflow"
Documentation = "https://dqflow.readthedocs.io/en/latest/"
Issues = "https://github.com/dqflow/dqflow/issues"
Discussions = "https://github.com/dqflow/dqflow/discussions"
Changelog = "https://github.com/dqflow/dqflow/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/dqflow/dqflow/blob/main/ROADMAP.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dqflow"]

[tool.hatch.version]
path = "src/dqflow/_version.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
# Analysis target. The runtime floor (3.11) is enforced by requires-python,
# ruff's target-version, and the 3.11 leg of the test matrix; mypy stays on
# 3.12 because current third-party stubs (numpy) use 3.12+ syntax.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/dqflow"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
